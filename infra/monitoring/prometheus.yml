# Objetivo: recolectar métricas del backend (GET /metrics) cada 15 s.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pintotech-backend
    metrics_path: /metrics
    # Si METRICS_TOKEN está definido, descomentar:
    # authorization:
    #   credentials: <METRICS_TOKEN>
    static_configs:
      - targets: ['backend:3000']
