# Objetivo: alertas mínimas de operación.
groups:
  - name: pintotech
    rules:
      - alert: BackendCaido
        expr: up{job="pintotech-backend"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: 'El backend de PINTOTECH no responde' }

      - alert: CorreosFallando
        expr: increase(pintotech_notifications_processed_total{result="failed"}[30m]) > 3
        labels: { severity: warning }
        annotations: { summary: 'Más de 3 correos fallidos en 30 minutos (revisar Mailgun)' }

      - alert: ColaDeCorreosAcumulada
        expr: pintotech_notifications_pending > 20
        for: 15m
        labels: { severity: warning }
        annotations: { summary: 'Hay más de 20 correos pendientes por 15 min' }

      - alert: LatenciaAlta
        expr: histogram_quantile(0.95, sum(rate(pintotech_http_request_duration_seconds_bucket[5m])) by (le)) > 2.5
        for: 10m
        labels: { severity: warning }
        annotations: { summary: 'p95 de latencia HTTP > 2.5 s (RNF-01)' }

      - alert: ErroresServidor
        expr: sum(rate(pintotech_http_request_duration_seconds_count{status_code=~"5.."}[5m])) > 0.1
        for: 5m
        labels: { severity: critical }
        annotations: { summary: 'Tasa de errores 5xx elevada' }
