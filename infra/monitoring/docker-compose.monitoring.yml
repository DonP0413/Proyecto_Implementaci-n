# =============================================================================
# Stack de observabilidad opcional (Prometheus + Grafana + Uptime Kuma).
#   docker compose -f docker-compose.yml -f infra/monitoring/docker-compose.monitoring.yml up -d
# Grafana: http://localhost:3001  (admin / GRAFANA_ADMIN_PASSWORD)
# =============================================================================
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=30d']
    ports: ['127.0.0.1:9090:9090']
    networks: [frontend-net]

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-cambiar}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infra/monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    ports: ['127.0.0.1:3001:3000']
    networks: [frontend-net]

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes: [kumadata:/app/data]
    ports: ['127.0.0.1:3002:3001']
    networks: [frontend-net]

volumes:
  promdata:
  grafanadata:
  kumadata:
