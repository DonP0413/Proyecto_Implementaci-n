# Objetivo: configuración de SonarCloud (análisis de calidad: bugs, code smells, duplicación, cobertura).
sonar.organization=<org-sonarcloud>
sonar.projectKey=<org>_pintotech
sonar.projectName=PINTOTECH
sonar.sources=backend/src,frontend/src
sonar.tests=backend/src,backend/test,frontend/src
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.qualitygate.wait=true
