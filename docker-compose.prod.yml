# =============================================================================
# docker-compose.prod.yml — Staging / Producción.
# Usa imágenes ya construidas por GitHub Actions (GHCR) con tag SemVer,
# no expone PostgreSQL al host y limita recursos.
#   docker compose -f docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
# =============================================================================
name: ${COMPOSE_PROJECT_NAME:-pintotech}

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 1g }
    networks: [backend-net]

  backend:
    image: ${REGISTRY:?}/pintotech-backend:${IMAGE_TAG:?}
    restart: always
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      SWAGGER_ENABLED: 'false'
      RUN_MIGRATIONS: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/storage
    deploy:
      resources:
        limits: { memory: 768m }
    networks: [backend-net, frontend-net]
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '10' }

  frontend:
    image: ${REGISTRY:?}/pintotech-frontend:${IMAGE_TAG:?}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-8080}:8080'
    networks: [frontend-net]

volumes:
  pgdata:
  uploads:

networks:
  backend-net:
  frontend-net:
