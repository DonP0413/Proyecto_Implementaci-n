# =============================================================================
# docker-compose.yml — Entorno completo Dev/QA en una máquina.
#   cp .env.example .env   (completar secretos)
#   docker compose up -d --build
#   Frontend: http://localhost:8080   API docs: http://localhost:8080/api/docs
# Servicios:
#   postgres -> PostgreSQL 16 con volumen persistente y healthcheck
#   backend  -> NestJS (aplica migraciones al iniciar)
#   frontend -> Nginx sirviendo la SPA + reverse proxy /api -> backend
# =============================================================================
name: ${COMPOSE_PROJECT_NAME:-pintotech}

x-backend-env: &backend-env
  NODE_ENV: ${NODE_ENV:-production}
  APP_VERSION: ${APP_VERSION:-dev}
  PORT: 3000
  LOG_LEVEL: ${LOG_LEVEL:-info}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${POSTGRES_USER:-pintotech}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
  DB_NAME: ${POSTGRES_DB:-pintotech}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
  THROTTLE_LIMIT: ${THROTTLE_LIMIT:-120}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  MAIL_DRIVER: ${MAIL_DRIVER:-console}
  MAIL_FROM: ${MAIL_FROM:-PINTOTECH <no-reply@example.com>}
  MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
  MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
  MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
  MAILGUN_REGION: ${MAILGUN_REGION:-us}
  NOTIFICATIONS_WORKER_ENABLED: ${NOTIFICATIONS_WORKER_ENABLED:-true}
  NOTIFICATIONS_MAX_ATTEMPTS: ${NOTIFICATIONS_MAX_ATTEMPTS:-5}
  NOTIFICATIONS_BASE_DELAY_SECONDS: ${NOTIFICATIONS_BASE_DELAY_SECONDS:-30}
  UPLOAD_MAX_FILE_SIZE_MB: ${UPLOAD_MAX_FILE_SIZE_MB:-8}
  UPLOAD_MAX_FILES: ${UPLOAD_MAX_FILES:-6}
  COMPANY_NAME: ${COMPANY_NAME:-PINTOTECH}
  COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}
  COMPANY_PHONE: ${COMPANY_PHONE:-}
  COMPANY_EMAIL: ${COMPANY_EMAIL:-}
  COMPANY_WEBSITE: ${COMPANY_WEBSITE:-}
  WORK_ORDER_PREFIX: ${WORK_ORDER_PREFIX:-PT}
  APP_TIMEZONE: ${APP_TIMEZONE:-America/Guayaquil}
  RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
  RUN_SEED: ${RUN_SEED:-false}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  ADMIN_NAME: ${ADMIN_NAME:-Administrador}
  STORAGE_LOCAL_PATH: /app/storage
  MIGRATIONS_DIR: /app/database/migrations

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pintotech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-pintotech}
      TZ: UTC
      PGTZ: UTC
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'   # sólo localhost del host
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend-net]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: pintotech-backend:${APP_VERSION:-dev}
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/storage
    expose:
      - '3000'
    networks: [backend-net, frontend-net]
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
        APP_VERSION: ${APP_VERSION:-dev}
    image: pintotech-frontend:${APP_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-8080}:8080'
    networks: [frontend-net]

volumes:
  pgdata:
  uploads:

networks:
  backend-net:    # BD aislada: sólo el backend la ve
  frontend-net:
