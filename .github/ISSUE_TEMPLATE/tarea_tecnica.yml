name: Tarea técnica
description: Configuración, infraestructura, refactor o deuda técnica
title: '[TEC] '
body:
  - type: textarea
    id: goal
    attributes:
      label: Objetivo
    validations: { required: true }
  - type: textarea
    id: dod
    attributes:
      label: Definición de terminado (DoD)
      value: |
        - [ ] Código revisado y mergeado a develop
        - [ ] CI en verde
        - [ ] Documentación actualizada
    validations: { required: true }
